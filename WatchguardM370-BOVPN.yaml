zabbix_export:
  version: '5.4'
  date: '2024-05-05T00:00:00Z'
  groups:
    -
      uuid: 3687ddca73944f909a183e9613e508ec
      name: 'Templates/Network devices'
  templates:
    -
      uuid: 0fe5cea418dd4a139dcdaa1ddc95332a
      template: 'WatchGuard M370 BOVPN'
      name: 'WatchGuard M370 BOVPN'
      description: 'Monitor BOVPN tunnels on WatchGuard M370 via SNMP.'
      groups:
        -
          name: 'Templates/Network devices'
      discovery_rules:
        -
          uuid: 3e502108587f4ffb96d88978833f6075
          name: 'BOVPN tunnel discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#TUNNAME},1.3.6.1.4.1.3097.1.3.2.1.2,{#LOCALGATEWAY},1.3.6.1.4.1.3097.1.3.2.1.3,{#REMOTEGATEWAY},1.3.6.1.4.1.3097.1.3.2.1.4]'
          key: watchguard.bovpn.discovery
          delay: 1h
          description: 'Discover BOVPN tunnels.'
          item_prototypes:
            -
              uuid: 2975302a0802427c9ec9c0f715e4b8ff
              name: 'BOVPN {#TUNNAME}: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3097.1.3.2.1.5.{#SNMPINDEX}'
              key: 'watchguard.bovpn.status[{#SNMPINDEX}]'
              value_type: UNSIGNED
              description: 'Operational status of BOVPN tunnel.'
            -
              uuid: 11013cb90af84b04af92a01d60032844
              name: 'BOVPN {#TUNNAME}: Inbound Bytes'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3097.1.3.2.1.6.{#SNMPINDEX}'
              key: 'watchguard.bovpn.in.bytes[{#SNMPINDEX}]'
              units: B
              description: 'Bytes received over BOVPN tunnel.'
            -
              uuid: b9c9c0d97b8e4c369d69d474a5a01cce
              name: 'BOVPN {#TUNNAME}: Outbound Bytes'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3097.1.3.2.1.7.{#SNMPINDEX}'
              key: 'watchguard.bovpn.out.bytes[{#SNMPINDEX}]'
              units: B
              description: 'Bytes sent over BOVPN tunnel.'
            -
              uuid: a7d5a0e834c14e8590210eef35b9147b
              name: 'BOVPN {#TUNNAME}: Local gateway'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3097.1.3.2.1.3.{#SNMPINDEX}'
              key: 'watchguard.bovpn.local.gateway[{#SNMPINDEX}]'
              value_type: TEXT
              description: 'Local gateway IP address.'
            -
              uuid: 2b0d733056ab42e18e2fd9f59fd6f23a
              name: 'BOVPN {#TUNNAME}: Remote gateway'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3097.1.3.2.1.4.{#SNMPINDEX}'
              key: 'watchguard.bovpn.remote.gateway[{#SNMPINDEX}]'
              value_type: TEXT
              description: 'Remote gateway IP address.'
